# Python lint for the four services (make lint). Default rules: syntax errors, undefined names,
# unused imports and variables.
target-version = "py313"
line-length = 120
extend-exclude = ["frontend-service", "**/node_modules", "config/runtime"]

[lint]
select = ["E4", "E7", "E9", "F"]

[lint.per-file-ignores]
# Packages that re-export their routers and models
"**/__init__.py" = ["F401"]
# Tests put the service on sys.path before importing it
"**/tests/**" = ["E402"]
