# ============================================================
# BornToShare — every service in one file
# Configuration: .env (same directory, see .env.example). Each service only
# receives the variables it reads, never the whole file.
#
#   make up        build if needed and start everything
#   make down      stop everything
# ============================================================

x-hardening: &hardening
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

# Health probes: Python services call their /health route, the frontend its login page
x-healthcheck: &healthcheck
  interval: 15s
  timeout: 5s
  retries: 5
  start_period: 20s

x-common-env: &common-env
  TZ: Europe/Paris
  LOG_LEVEL: INFO
  INTERNAL_TOKEN: ${INTERNAL_TOKEN:?INTERNAL_TOKEN must be set}

services:
  # Dramatiq broker (job queue between core-service and capsule-runner, database 2)
  # and user sessions of auth-service (database 1), which survive its restarts
  redis:
    <<: *hardening
    container_name: redis
    image: docker.io/library/redis:8.10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --appendfsync everysec --requirepass "$$REDIS_PASSWORD"
    read_only: false              # writes its append-only file to /data
    volumes:
      - redis-data:/data
    user: "999:999"               # "redis" user of the official image
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "redis-cli", "ping"]
    networks: [jobs]

  auth-service:
    <<: *hardening
    container_name: auth-service
    image: b2s-auth-service:latest
    build: ./auth-service
    environment:
      <<: *common-env
      PRINCIPAL_SIGNING_KEY: ${PRINCIPAL_SIGNING_KEY}
      SESSION_STORE_BACKEND: redis
      REDIS_DB: 1
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - ./capsule-runner/certs:/etc/b2s/certs:ro,z
    expose: ["8000"]
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
    depends_on:
      redis:
        condition: service_healthy
    networks: [app, jobs]

  core-service:
    <<: *hardening
    container_name: core-service
    image: b2s-core-service:latest
    build: ./core-service
    environment:
      <<: *common-env
      B2S_SECRET_MASTER_KEY: ${B2S_SECRET_MASTER_KEY:?B2S_SECRET_MASTER_KEY must be set}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      # Audit database: same server and account as DB_*
      LOGGING_DB_NAME: ${LOGGING_DB_NAME}
      CAPSULE_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/2
      # The 5S module, when installed: it receives each measure of a folder
      B2S_FIVES_URL: http://fives-service:8000
      # Database chosen in Advanced Settings › Infrastructure, read at startup (replaces DB_*)
      B2S_RUNTIME_DIR: /etc/b2s/runtime
    volumes:
      - ./config/runtime:/etc/b2s/runtime:rw,z
      - ./capsule-runner/certs:/etc/b2s/certs:ro,z
    expose: ["8000"]
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
    depends_on:
      redis:
        condition: service_healthy
    networks: [app, data, jobs]

  capsule-runner:
    <<: *hardening
    container_name: capsule-runner
    image: b2s-capsule-runner:latest
    build: ./capsule-runner
    environment:
      <<: *common-env
      CAPSULE_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/2
      RUNNER_MAX_SCOPE: ${RUNNER_MAX_SCOPE:-write}
    # Agent checked by core-service: HTTPS on 8443 with certs/agent.crt + agent.key, else HTTP on 8080
    volumes:
      - ./capsule-runner/certs:/etc/b2s/certs:ro,z
    expose: ["8443", "8080"]
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "python", "-m", "app.healthcheck"]
    depends_on:
      redis:
        condition: service_healthy
    networks: [app, jobs]

  frontend-service:
    <<: *hardening
    container_name: frontend-service
    image: b2s-frontend-service:latest
    build:
      context: ./frontend-service
      args:
        B2S_VERSION: ${B2S_VERSION:-}
    environment:
      <<: *common-env
      ORIGIN: ${FRONTEND_PUBLIC_ORIGIN:-http://localhost:3000}
      # Upstreams of the BFF (no default in the frontend code)
      B2S_AUTH_URL: http://auth-service:8000
      B2S_CORE_URL: http://core-service:8000/api
      # The 5S module (when installed and licensed): /api/modules/fives/*
      B2S_FIVES_URL: http://fives-service:8000
      PRINCIPAL_SIGNING_KEY: ${PRINCIPAL_SIGNING_KEY}
    ports:
      - "${FRONTEND_PUBLISHED_PORT:-3000}:3000"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/login').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
    depends_on:
      auth-service:
        condition: service_healthy
      core-service:
        condition: service_healthy
    networks: [app]

  # Optional module « 5S et hygiène des données » (licensed): its own container and databases
  # (b2s_fives, b2s_fives_inventory, account FIVES_DB_USER), installed by scripts/modules/fives/install.sh.
  # Started with the profile « fives » (make deploy does it when FIVES_DB_PASSWORD is set).
  fives-service:
    <<: *hardening
    container_name: fives-service
    image: b2s-fives-service:latest
    build: ./fives-service
    profiles: [fives]
    environment:
      <<: *common-env
      B2S_CORE_URL: http://core-service:8000
      FIVES_DB_HOST: ${FIVES_DB_HOST:-${DB_HOST}}
      FIVES_DB_PORT: ${DB_PORT:-3306}
      FIVES_DB_USER: ${FIVES_DB_USER:-b2s_fives}
      FIVES_DB_PASSWORD: ${FIVES_DB_PASSWORD:-}
      FIVES_DB_NAME: ${FIVES_DB_NAME:-b2s_fives}
      FIVES_INVENTORY_DB_NAME: ${FIVES_INVENTORY_DB_NAME:-b2s_fives_inventory}
    expose: ["8000"]
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
    networks: [app, data]

  # Database initialization (run once, then stop it: make wizard / make wizard-down)
  wizard-ui:
    <<: *hardening
    container_name: wizard-ui
    image: b2s-wizard-ui:latest
    build: ./wizard-ui
    profiles: [wizard]
    environment:
      TZ: Europe/Paris
      LOG_LEVEL: INFO
    ports:
      - "${WIZARD_PORT:-8080}:8080"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=3)"]
    networks: [app, data]

networks:
  app:
    name: b2s-app
  data:
    name: b2s-data
    internal: true
  jobs:
    name: b2s-jobs
    internal: true

volumes:
  redis-data:
    name: b2s-redis-data
