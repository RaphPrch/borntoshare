# ============================================================
# BornToShare — every service in one file
# Configuration: .env (same directory, see .env.example), without any password nor key. Each service only
# receives the variables it reads, never the whole file. Passwords and keys are podman secrets (end of this file,
# scripts/secrets.sh): files in /run/secrets (mode 0400, uid of the service), never in the environment.
#
#   make up        build if needed and start everything
#   make down      stop everything
# ============================================================

x-hardening: &hardening
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

# Health probes: Python services call their /health route, the frontend its login page
x-healthcheck: &healthcheck
  interval: 15s
  timeout: 5s
  retries: 5
  start_period: 20s

x-common-env: &common-env
  TZ: Europe/Paris
  LOG_LEVEL: INFO
  # The token shared by the services: a podman secret (generated by make deploy), read from its file
  INTERNAL_TOKEN_FILE: /run/secrets/b2s_internal_token

services:
  # Dramatiq broker (job queue between core-service and capsule-runner, database 2)
  # and user sessions of auth-service (database 1), which survive its restarts
  redis:
    <<: *hardening
    container_name: redis
    image: docker.io/library/redis:8.10
    secrets:
      - {source: b2s_redis, uid: "999", gid: "999", mode: "0400"}
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --appendfsync everysec --requirepass "$$(cat /run/secrets/b2s_redis)"
    read_only: false              # writes its append-only file to /data
    volumes:
      - redis-data:/data
    user: "999:999"               # "redis" user of the official image
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$(cat /run/secrets/b2s_redis) redis-cli ping | grep -q PONG"]
    networks: [jobs]

  auth-service:
    <<: *hardening
    container_name: auth-service
    image: b2s-auth-service:latest
    build: ./auth-service
    environment:
      <<: *common-env
      PRINCIPAL_SIGNING_KEY_FILE: /run/secrets/b2s_principal_key
      SESSION_STORE_BACKEND: redis
      REDIS_DB: 1
      REDIS_PASSWORD_FILE: /run/secrets/b2s_redis
    secrets:
      - {source: b2s_redis, uid: "10001", mode: "0400"}
      - {source: b2s_internal_token, uid: "10001", mode: "0400"}
      - {source: b2s_principal_key, uid: "10001", mode: "0400"}
    volumes:
      - ./capsule-runner/certs:/etc/b2s/certs:ro,z
    expose: ["8000"]
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
    depends_on:
      redis:
        condition: service_healthy
    networks: [app, jobs]

  core-service:
    <<: *hardening
    container_name: core-service
    image: b2s-core-service:latest
    build: ./core-service
    environment:
      <<: *common-env
      B2S_SECRET_MASTER_KEY_FILE: /run/secrets/b2s_master_key
      DB_HOST: ${DB_HOST:?DB_HOST must be set}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-borntoshare}
      # TLS to MariaDB: on = encrypted, certificate and name checked (certs/db-ca.pem, else the system authorities)
      DB_TLS: ${DB_TLS:-off}
      # Its own account: read and write on DB_NAME, insert/read/purge on LOGGING_DB_NAME, no schema change
      DB_USER: ${DB_USER:-b2s_core}
      DB_PASSWORD_FILE: /run/secrets/b2s_db_core
      # Audit database: same server and account as DB_*
      LOGGING_DB_NAME: ${LOGGING_DB_NAME:-borntoshare_logging}
      # Shown on Advanced Settings › Infrastructure › Database: the account of make deploy (never used by core)
      DB_MIGRATE_USER: ${DB_MIGRATE_USER:-b2s_migrate}
      # The Redis password is added from REDIS_PASSWORD_FILE
      CAPSULE_BROKER_URL: redis://redis:6379/2
      REDIS_PASSWORD_FILE: /run/secrets/b2s_redis
      # The 5S module, when installed: it receives each measure of a folder
      B2S_FIVES_URL: http://fives-service:8000
    secrets:
      - {source: b2s_master_key, uid: "10002", mode: "0400"}
      - {source: b2s_db_core, uid: "10002", mode: "0400"}
      - {source: b2s_redis, uid: "10002", mode: "0400"}
      - {source: b2s_internal_token, uid: "10002", mode: "0400"}
    volumes:
      - ./capsule-runner/certs:/etc/b2s/certs:ro,z
    expose: ["8000"]
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
    depends_on:
      redis:
        condition: service_healthy
    networks: [app, data, jobs]

  capsule-runner:
    <<: *hardening
    container_name: capsule-runner
    image: b2s-capsule-runner:latest
    build: ./capsule-runner
    environment:
      <<: *common-env
      CAPSULE_BROKER_URL: redis://redis:6379/2
      REDIS_PASSWORD_FILE: /run/secrets/b2s_redis
      RUNNER_MAX_SCOPE: ${RUNNER_MAX_SCOPE:-write}
    secrets:
      - {source: b2s_redis, uid: "10003", mode: "0400"}
      - {source: b2s_internal_token, uid: "10003", mode: "0400"}
    # Agent checked by core-service: HTTPS on 8443 with certs/agent.crt + agent.key, else HTTP on 8080
    volumes:
      - ./capsule-runner/certs:/etc/b2s/certs:ro,z
    expose: ["8443", "8080"]
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "python", "-m", "app.healthcheck"]
    depends_on:
      redis:
        condition: service_healthy
    networks: [app, jobs]

  frontend-service:
    <<: *hardening
    container_name: frontend-service
    image: b2s-frontend-service:latest
    build:
      context: ./frontend-service
      args:
        B2S_VERSION: ${B2S_VERSION:-}
    environment:
      <<: *common-env
      ORIGIN: ${FRONTEND_PUBLIC_ORIGIN:-http://localhost:3000}
      # Upstreams of the BFF (no default in the frontend code)
      B2S_AUTH_URL: http://auth-service:8000
      B2S_CORE_URL: http://core-service:8000/api
      # The 5S module (when installed and licensed): /api/modules/fives/*
      B2S_FIVES_URL: http://fives-service:8000
      PRINCIPAL_SIGNING_KEY_FILE: /run/secrets/b2s_principal_key
    secrets:
      - {source: b2s_internal_token, uid: "10006", mode: "0400"}
      - {source: b2s_principal_key, uid: "10006", mode: "0400"}
    ports:
      - "${FRONTEND_PUBLISHED_PORT:-3000}:3000"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/login').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
    depends_on:
      auth-service:
        condition: service_healthy
      core-service:
        condition: service_healthy
    networks: [app]

  # Optional module « 5S et hygiène des données » (licensed): its own container and databases
  # (b2s_fives, b2s_fives_inventory, account FIVES_DB_USER: read and write only), created by the wizard (run it
  # again to add the module later). Started with the profile « fives » (make deploy does it when the podman
  # secret b2s_db_fives exists).
  fives-service:
    <<: *hardening
    container_name: fives-service
    image: b2s-fives-service:latest
    build: ./fives-service
    profiles: [fives]
    environment:
      <<: *common-env
      B2S_CORE_URL: http://core-service:8000
      # The bases of the module on a MariaDB server of their own (FIVES_DB_HOST/PORT in .env), else on the one of
      # BornToShare (DB_HOST/PORT): the module takes the first that is set
      FIVES_DB_HOST: ${FIVES_DB_HOST:-}
      FIVES_DB_PORT: ${FIVES_DB_PORT:-}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-3306}
      # TLS to MariaDB: on = encrypted, certificate and name checked (certs/db-ca.pem, else the system authorities)
      DB_TLS: ${DB_TLS:-off}
      FIVES_DB_USER: ${FIVES_DB_USER:-b2s_fives}
      FIVES_DB_PASSWORD_FILE: /run/secrets/b2s_db_fives
      FIVES_DB_NAME: ${FIVES_DB_NAME:-b2s_fives}
      FIVES_INVENTORY_DB_NAME: ${FIVES_INVENTORY_DB_NAME:-b2s_fives_inventory}
    secrets:
      - {source: b2s_db_fives, uid: "10005", mode: "0400"}
      - {source: b2s_internal_token, uid: "10005", mode: "0400"}
    volumes:
      - ./capsule-runner/certs:/etc/b2s/certs:ro,z
    expose: ["8000"]
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
    networks: [app, data]

  # Parquet lake of the 5S module (history, analytics): the image of fives-service, its own process (an export reads
  # millions of rows: never in the process of the API). Off while B2S_LAKE_URI is empty (profile lake, make deploy
  # starts it when the line is in .env). Commands: podman exec fives-lake python -m app.lake list|verify|usage…
  fives-lake:
    <<: *hardening
    container_name: fives-lake
    image: b2s-fives-service:latest
    profiles: [lake]
    command: ["python", "-m", "app.lake", "worker"]
    environment:
      <<: *common-env
      B2S_CORE_URL: http://core-service:8000
      # The bases of the module on a MariaDB server of their own (FIVES_DB_HOST/PORT in .env), else on the one of
      # BornToShare (DB_HOST/PORT): the module takes the first that is set
      FIVES_DB_HOST: ${FIVES_DB_HOST:-}
      FIVES_DB_PORT: ${FIVES_DB_PORT:-}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-3306}
      # TLS to MariaDB: on = encrypted, certificate and name checked (certs/db-ca.pem, else the system authorities)
      DB_TLS: ${DB_TLS:-off}
      FIVES_DB_USER: ${FIVES_DB_USER:-b2s_fives}
      FIVES_DB_PASSWORD_FILE: /run/secrets/b2s_db_fives
      FIVES_DB_NAME: ${FIVES_DB_NAME:-b2s_fives}
      FIVES_INVENTORY_DB_NAME: ${FIVES_INVENTORY_DB_NAME:-b2s_fives_inventory}
      B2S_LAKE_URI: ${B2S_LAKE_URI:-file:///lake}
      B2S_LAKE_S3_ENDPOINT: ${B2S_LAKE_S3_ENDPOINT:-}
      B2S_LAKE_S3_REGION: ${B2S_LAKE_S3_REGION:-}
      # S3 keys: the podman secrets b2s_lake_s3_access and b2s_lake_s3_secret, mounted by podman-compose.lake-s3.yml
      # (added by make deploy when they exist), never in .env
      B2S_LAKE_HOUR: ${B2S_LAKE_HOUR:-7}
      B2S_LAKE_KEEP_DAYS: ${B2S_LAKE_KEEP_DAYS:-400}
    secrets:
      - {source: b2s_db_fives, uid: "10005", mode: "0400"}
      - {source: b2s_internal_token, uid: "10005", mode: "0400"}
    volumes:
      - b2s-lake:/lake
      - ./capsule-runner/certs:/etc/b2s/certs:ro,z
    networks: [app, data]

  # Scanner of the 5S module: walks the folders ON their Windows file servers (WinRM, Kerberos, no agent), from the
  # queue in b2s_fives; several instances possible (one per site: SCANNER_ID). Built from the root of the repository
  # (it reuses the WinRM code of capsule-runner).
  # No fixed container name: several instances (FIVES_SCANNERS, or one per site with SCANNER_ID set) take the queue
  # together; each one is known by its own name (SCANNER_ID, else the name of its container).
  fives-scanner:
    <<: *hardening
    image: b2s-fives-scanner:latest
    scale: ${FIVES_SCANNERS:-1}
    build:
      context: .
      dockerfile: fives-scanner/Containerfile
    profiles: [fives]
    environment:
      <<: *common-env
      CORE_URL: http://core-service:8000
      SCANNER_ID: ${FIVES_SCANNER_ID:-}
      # The bases of the module on a MariaDB server of their own (FIVES_DB_HOST/PORT in .env), else on the one of
      # BornToShare (DB_HOST/PORT): the module takes the first that is set
      FIVES_DB_HOST: ${FIVES_DB_HOST:-}
      FIVES_DB_PORT: ${FIVES_DB_PORT:-}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-3306}
      # TLS to MariaDB: on = encrypted, certificate and name checked (certs/db-ca.pem, else the system authorities)
      DB_TLS: ${DB_TLS:-off}
      FIVES_DB_USER: ${FIVES_DB_USER:-b2s_fives}
      FIVES_DB_PASSWORD_FILE: /run/secrets/b2s_db_fives
      FIVES_DB_NAME: ${FIVES_DB_NAME:-b2s_fives}
      FIVES_INVENTORY_DB_NAME: ${FIVES_INVENTORY_DB_NAME:-b2s_fives_inventory}
    secrets:
      - {source: b2s_db_fives, uid: "10006", mode: "0400"}
      - {source: b2s_internal_token, uid: "10006", mode: "0400"}
    volumes:
      - ./capsule-runner/certs:/etc/b2s/certs:ro,z
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "python", "-c", "import os, time; assert time.time() - os.path.getmtime('/tmp/scanner-alive') < 120"]
    networks: [app, data]

  # Database initialization (run once, then stop it: make wizard / make wizard-down)
  wizard-ui:
    <<: *hardening
    container_name: wizard-ui
    image: b2s-wizard-ui:latest
    build: ./wizard-ui
    profiles: [wizard]
    environment:
      TZ: Europe/Paris
      LOG_LEVEL: INFO
      # The fields start from .env (names only)
      DB_HOST: ${DB_HOST:-}
      DB_PORT: ${DB_PORT:-3306}
      DB_TLS: ${DB_TLS:-off}
      FIVES_DB_HOST: ${FIVES_DB_HOST:-}
      FIVES_DB_PORT: ${FIVES_DB_PORT:-}
      DB_NAME: ${DB_NAME:-borntoshare}
      DB_USER: ${DB_USER:-b2s_core}
      DB_MIGRATE_USER: ${DB_MIGRATE_USER:-b2s_migrate}
      LOGGING_DB_NAME: ${LOGGING_DB_NAME:-borntoshare_logging}
      FIVES_DB_NAME: ${FIVES_DB_NAME:-b2s_fives}
      FIVES_INVENTORY_DB_NAME: ${FIVES_INVENTORY_DB_NAME:-b2s_fives_inventory}
      FIVES_DB_USER: ${FIVES_DB_USER:-b2s_fives}
      # The generated passwords of the SQL accounts go there (0600), make deploy turns them into podman secrets;
      # the end of the installation too, for scripts/after-wizard.sh (it deploys)
      SECRETS_DIR: /secrets
      # The link shown once deployed, and the way this installation runs (the steps start from them)
      FRONTEND_PUBLIC_ORIGIN: ${FRONTEND_PUBLIC_ORIGIN:-}
      FRONTEND_PUBLISHED_PORT: ${FRONTEND_PUBLISHED_PORT:-3000}
      B2S_DEPLOY_MODE: ${B2S_DEPLOY_MODE:-}
      B2S_WEB_LOCATION: ${B2S_WEB_LOCATION:-}
      B2S_WEB_SERVER_NAME: ${B2S_WEB_SERVER_NAME:-}
      B2S_WEB_HTTPS_PORT: ${B2S_WEB_HTTPS_PORT:-}
      B2S_WEB_CERT: ${B2S_WEB_CERT:-}
      B2S_WEB_KEY: ${B2S_WEB_KEY:-}
      B2S_WEB_HOST: ${B2S_WEB_HOST:-}
      B2S_WEB_IP: ${B2S_WEB_IP:-}
      B2S_API_HOST: ${B2S_API_HOST:-}
      B2S_AUTH_PORT: ${B2S_AUTH_PORT:-}
      B2S_CORE_PORT: ${B2S_CORE_PORT:-}
      B2S_FIVES_PORT: ${B2S_FIVES_PORT:-}
      B2S_WEB_PUSH: ${B2S_WEB_PUSH:-}
      B2S_WEB_SSH_USER: ${B2S_WEB_SSH_USER:-}
      B2S_WEB_SSH_KEY: ${B2S_WEB_SSH_KEY:-}
    # root of the container = the owner of the files on the host (rootless podman): secrets/ stays readable by it only
    user: "0:0"
    volumes:
      - ./secrets:/secrets:rw,z
      # The private authority of the MariaDB servers (db-ca.pem), for « TLS »
      - ./capsule-runner/certs:/etc/b2s/certs:ro,z
    ports:
      - "${WIZARD_PORT:-8080}:8080"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=3)"]
    networks: [app, data]

# Podman secrets, created by scripts/secrets.sh (make deploy) from the files the wizard writes in secrets/
  # Test mail server of the lab (profile « mail », make mail-up): catches every e-mail of BornToShare, nothing
  # leaves. SMTP on mailpit:1025 for the services only; the mails are read on http://<host>:8025. Kept in memory.
  mailpit:
    <<: *hardening
    container_name: mailpit
    image: docker.io/axllent/mailpit:v1.21.8
    profiles: [mail]
    environment:
      TZ: Europe/Paris
      MP_MAX_MESSAGES: "2000"
    expose: ["1025"]
    ports: ["8025:8025"]
    networks: [app]

  # Lab OpenTelemetry Collector (profile « otel », make otel-up): receives what Advanced settings › Extensions sends,
  # as OTLP (http://otel-lab:4318), syslog (otel-lab:54526 TCP RFC 5424) and Splunk HEC (http://otel-lab:8088), and
  # shows it in its log (make otel-logs). testing/otel/collector.yaml; never in production.
  otel-lab:
    <<: *hardening
    container_name: otel-lab
    image: docker.io/otel/opentelemetry-collector-contrib:0.115.1
    profiles: [otel]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev
      - /data:rw,noexec,nosuid,nodev,mode=1777
    volumes:
      - ./testing/otel/collector.yaml:/etc/otelcol-contrib/config.yaml:ro,z
    expose: ["4318", "54526", "8088"]
    networks: [app]


secrets:
  b2s_master_key:
    external: true
  b2s_redis:
    external: true
  b2s_db_core:
    external: true
  b2s_db_fives:
    external: true
  # The token shared by the services, the key of the session cookie: generated by make deploy (scripts/secrets.sh),
  # changed by make rotate-tokens
  b2s_internal_token:
    external: true
  b2s_principal_key:
    external: true

networks:
  app:
    name: b2s-app
  data:
    name: b2s-data
    internal: true
  jobs:
    name: b2s-jobs
    internal: true

volumes:
  redis-data:
    name: b2s-redis-data
  # The Parquet lake when it is local (B2S_LAKE_URI file:///lake); an S3 store needs no volume
  b2s-lake:
    name: b2s-lake
