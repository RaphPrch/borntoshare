# ============================================================
# BornToShare UI v2: the new interface, next to the current one
# Built from the borntoshare-ui-v2 branch, published on its own port, plugged into the services of the running
# stack (same auth, core and 5S, same data). The current interface stays on its port.
#
#   make ui-v2-up      build and start it (http://<host>:$UI_V2_PORT, 3001 by default)
#   make ui-v2-down    stop it
# Variables: the .env of the main checkout (B2S_MAIN_DIR, ../services by default).
# ============================================================

services:
  frontend-ui-v2:
    container_name: frontend-ui-v2
    image: b2s-frontend-ui-v2:latest
    build:
      context: ./frontend-service
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: Europe/Paris
      LOG_LEVEL: INFO
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?INTERNAL_TOKEN must be set}
      ORIGIN: ${UI_V2_PUBLIC_ORIGIN:?UI_V2_PUBLIC_ORIGIN must be set}
      B2S_AUTH_URL: http://auth-service:8000
      B2S_CORE_URL: http://core-service:8000/api
      B2S_FIVES_URL: http://fives-service:8000
      PRINCIPAL_SIGNING_KEY: ${PRINCIPAL_SIGNING_KEY}
    ports:
      - "${UI_V2_PORT:-3001}:3000"
    networks: [app]

networks:
  app:
    name: b2s-app
    external: true
