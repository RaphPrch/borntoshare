version: "3.9"

services:
  core-service:
    container_name: core-service

    image: b2s-core-service:1.0
    build:
      context: .
      dockerfile: Containerfile

    restart: unless-stopped

    env_file:
      - .env

    environment:
      TZ: Europe/Paris
      APP_ENV: ${APP_ENV:-dev}
      B2S_ENV: ${B2S_ENV:-${APP_ENV:-dev}}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

      # Direct mode: CSRF is not enforced by the core-service in this deployment.
      B2S_DISABLE_CSRF: "false"

      # Governance (/api/governance/*): Dramatiq broker (redis/podman-compose.yml, password-protected)
      CAPSULE_BROKER_URL: ${CAPSULE_BROKER_URL:-redis://:${REDIS_PASSWORD}@redis:6379/2}
      # Direct mode: frontend-service can call public governance routes; /internal/ ones still need a token.
      B2S_ALLOW_PUBLIC_API: ${B2S_ALLOW_PUBLIC_API:-true}

    # --------------------------------------------------
    # Network exposure (INTERNAL ONLY)
    # --------------------------------------------------
    expose:
      - "8000"

    # --------------------------------------------------
    # Filesystem
    # --------------------------------------------------
    # core-service SHOULD NOT write to disk in v1
    read_only: true

    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev
      - /run:rw,noexec,nosuid,nodev


    # --------------------------------------------------
    # Security hardening
    # --------------------------------------------------
    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    # --------------------------------------------------
    # Runtime user (must match Containerfile)
    # --------------------------------------------------
    user: "10002:10002"

    # --------------------------------------------------
    # Networks
    # --------------------------------------------------
    networks:
      - app
      - data
      - jobs


networks:
  app:
    name: bts-app
    external: true

  data:
    name: bts-data
    external: true

  jobs:
    name: bts-jobs
    external: true
