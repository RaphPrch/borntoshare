name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: tests ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: auth-service
            workdir: auth-service
          - service: capsule-runner
            workdir: capsule-runner
          - service: dal-service
            workdir: dal-service
          - service: governance-service
            workdir: governance-service
          - service: secret-broker
            workdir: secret-broker
          - service: wizard-ui
            workdir: wizard-ui/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ matrix.service }}/requirements.txt
      - name: Install dependencies
        # httpx/httpx2: required by FastAPI's TestClient (test-only)
        run: pip install -r ${{ matrix.service }}/requirements.txt pytest pytest-asyncio httpx httpx2
      - name: Run tests
        working-directory: ${{ matrix.workdir }}
        run: |
          # auth-service settings require INTERNAL_TOKEN; dal-service refuses it in hmac mode
          if [ "${{ matrix.service }}" = "auth-service" ]; then export INTERNAL_TOKEN=ci-internal-token; fi
          python -m pytest -q

  frontend:
    name: frontend (build, tests, types)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend-service/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Unit tests
        run: |
          for script in $(node -p "Object.keys(require('./package.json').scripts).filter(k => k.startsWith('test:')).join(' ')"); do
            echo "::group::$script"
            npm run -s "$script"
            echo "::endgroup::"
          done
      - name: Type check (must not regress)
        # Pre-existing type errors are tolerated up to this baseline; lower it as they get fixed.
        env:
          MAX_TYPE_ERRORS: 69
        run: |
          npx svelte-kit sync
          errors=$(npx svelte-check --tsconfig ./tsconfig.json --output machine | grep -c ' ERROR ' || true)
          echo "svelte-check errors: $errors (max $MAX_TYPE_ERRORS)"
          test "$errors" -le "$MAX_TYPE_ERRORS"
