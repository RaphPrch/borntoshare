name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      # Same version and rules as « make lint » (ruff.toml)
      - run: pip install ruff==0.13.0
      # The 5S module (fives-service, fives-scanner) lives in its private repository and is checked there
      - run: ruff check --no-cache core-service auth-service capsule-runner wizard-ui

  python:
    name: tests ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: auth-service
            workdir: auth-service
          - service: capsule-runner
            workdir: capsule-runner
          - service: core-service
            workdir: core-service
          # From wizard-ui: the tests import backend.app.main
          - service: wizard-ui
            workdir: wizard-ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: ${{ matrix.service }}/requirements.txt
      - name: Install dependencies
        # httpx/httpx2: required by FastAPI's TestClient (test-only)
        run: pip install -r ${{ matrix.service }}/requirements.txt pytest pytest-asyncio httpx
      - name: Run tests
        working-directory: ${{ matrix.workdir }}
        run: |
          # auth-service settings require INTERNAL_TOKEN (core-service tests set their own)
          if [ "${{ matrix.service }}" = "auth-service" ]; then export INTERNAL_TOKEN=ci-internal-token; fi
          python -m pytest -q

  frontend:
    name: frontend (build, tests, types)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-service
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend-service/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Unit tests
        run: |
          for script in $(node -p "Object.keys(require('./package.json').scripts).filter(k => k.startsWith('test:')).join(' ')"); do
            echo "::group::$script"
            npm run -s "$script"
            echo "::endgroup::"
          done
      - name: Type check
        run: npm run check -- --threshold error

  secrets:
    name: secrets (Gitleaks)
    runs-on: ubuntu-latest
    # Reported, not blocking yet, like the dependency audit below
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  audit:
    name: dependencies (pip-audit, npm audit)
    runs-on: ubuntu-latest
    # Reported, not blocking yet: the known advisories are triaged first, then this job becomes required
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install pip-audit
      - name: Python services
        run: |
          status=0
          for service in auth-service core-service capsule-runner wizard-ui; do
            echo "::group::$service"
            pip-audit -r "$service/requirements.txt" || status=1
            echo "::endgroup::"
          done
          exit $status
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - name: Frontend
        working-directory: frontend-service
        run: npm audit --omit=dev --audit-level=high

  trivy:
    name: vulnerabilities and Containerfiles (Trivy)
    runs-on: ubuntu-latest
    # Reported, not blocking yet, like the dependency audit
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - name: Dependencies (HIGH, CRITICAL)
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          skip-dirs: fives-service,fives-scanner,frontend-service/node_modules
          exit-code: "1"
      # testing/ad-lab: the Samba test domain controller of the AD tests, root by nature and never deployed
      - name: Containerfiles and compose (misconfigurations)
        if: always()
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          skip-dirs: fives-service,fives-scanner,testing/ad-lab
          exit-code: "1"

