name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      # Same version and rules as « make lint » (ruff.toml)
      - run: pip install ruff==0.13.0
      # The 5S module (fives-service, fives-scanner) is in its own private repository, with its own CI
      - run: ruff check --no-cache core-service auth-service capsule-runner wizard-ui scripts/post_install.py

  python:
    name: tests ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: auth-service
            workdir: auth-service
          - service: capsule-runner
            workdir: capsule-runner
          - service: core-service
            workdir: core-service
          # From wizard-ui: the tests import backend.app.main
          - service: wizard-ui
            workdir: wizard-ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: ${{ matrix.service }}/requirements.txt
      - name: Install dependencies
        # httpx/httpx2: required by FastAPI's TestClient (test-only)
        run: |
          pip install -r ${{ matrix.service }}/requirements.txt pytest pytest-asyncio httpx
          # The installed dependencies agree with each other
          pip check
      - name: Run tests
        working-directory: ${{ matrix.workdir }}
        run: |
          # auth-service settings require INTERNAL_TOKEN (core-service tests set their own)
          if [ "${{ matrix.service }}" = "auth-service" ]; then export INTERNAL_TOKEN=ci-internal-token; fi
          python -m pytest -q

  frontend:
    name: frontend (build, tests, types)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-service
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend-service/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Unit tests
        run: |
          for script in $(node -p "Object.keys(require('./package.json').scripts).filter(k => k.startsWith('test:')).join(' ')"); do
            echo "::group::$script"
            npm run -s "$script"
            echo "::endgroup::"
          done
      - name: Type check
        run: npm run check -- --threshold error

  dependencies:
    name: known vulnerabilities (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install pip-audit
      - name: Audit the pinned requirements of each service
        run: |
          for service in auth-service capsule-runner core-service wizard-ui; do
            echo "::group::$service"
            pip-audit --requirement $service/requirements.txt --progress-spinner off
            echo "::endgroup::"
          done

  images:
    name: image ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [auth-service, capsule-runner, core-service, frontend-service, wizard-ui]
    steps:
      - uses: actions/checkout@v7
      - name: Build the image (as make deploy does)
        run: docker build -t b2s-${{ matrix.service }}:ci ${{ matrix.service }}

  scripts:
    name: shell scripts (ShellCheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck -x -S warning -e SC2034,SC2155,SC2148,SC2164,SC1010 scripts/*.sh scripts/native/*.sh scripts/web/*.sh
